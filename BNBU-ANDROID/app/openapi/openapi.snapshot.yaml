            properties:
              creditType: { const: GENERAL }
            required: [creditType]
          then:
            properties:
              description: { type: string, minLength: 1, maxLength: 200, pattern: '.*\S.*' }
            required: [description]
    UpdateExerciseRecordRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        creditType: { $ref: '#/components/schemas/CreditType' }
        sportType: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        sportName: { type: [string, 'null'], maxLength: 100 }
        description:
          description: Omit to preserve the current value. Null or blank is accepted only when the resulting creditType is COURSE_RELATED.
          oneOf:
            - { type: string, minLength: 1, maxLength: 200 }
            - { type: 'null' }
        expectedVersion: { $ref: '#/components/schemas/PositiveVersion' }
    SubmitExerciseRecordRequest:
