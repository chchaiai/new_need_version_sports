components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token carried only in the Authorization header.
    JoinCapability:
      type: apiKey
      in: header
      name: X-Join-Capability
      description: Short-lived one-time capability bound to one ClassSection. The plaintext value is never logged or persisted; no ordinary Access Token is accepted by the Join operation.
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID; the server returns the accepted/generated value in response header and meta.requestId.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse for retries of the same normalized request; reuse with different content returns a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to caller scope, filters, and sort.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated endpoint whitelist; prefix a field with '-' for descending order.
      schema:
        type: string
        maxLength: 200
    Search:
      name: q
      in: query
      required: false
      description: Search only endpoint-declared fields; never expands authorization scope.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ClassSectionFilter:
      name: classSectionId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OpaqueId'
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ClassSectionId:
      name: classSectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    InviteToken:
      name: inviteToken
      in: path
      required: true
      description: Opaque sensitive transport token; never log its full value.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    RosterImportId:
      name: rosterImportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    AlignmentResultId:
      name: alignmentResultId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ScoreRuleId:
      name: scoreRuleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    StudentScoreId:
      name: studentScoreId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ScoreAdjustmentId:
      name: scoreAdjustmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    AuditLogId:
      name: auditLogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
  requestBodies:
    VersionedReasonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionedReasonRequest'
    SessionControlBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionControlRequest'
  responses:
    EmptySuccess:
      description: Successful action with no resource body
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestIdResponseHeader' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptyEnvelope' }
    StudentSignInCodeAcceptedSuccess:
      description: Enumeration-safe student sign-in challenge acceptance
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestIdResponseHeader' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StudentSignInCodeAcceptedEnvelope' }
    AccountRecoveryAcceptedSuccess:
      description: Enumeration-safe account-recovery challenge acceptance
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestIdResponseHeader' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountRecoveryAcceptedEnvelope' }
    EmailVerificationChallengeAcceptedSuccess:
