  headers:
    RequestIdResponseHeader:
      description: Server-accepted/generated request ID; equals meta.requestId on success and requestId on error.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      description: Opaque internal ID; clients must not parse prefixes or ordering.
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    NonNegativeSeconds:
      type: integer
      format: int64
      minimum: 0
      description: Authoritative duration in whole seconds.
    ScoreTotalRequiredSeconds:
      type: integer
      format: int64
      const: 72000
      description: Accepted 20-hour total eligibility threshold from ADR-061.
    PositiveVersion:
      type: integer
      format: int64
      minimum: 1
    NonNegativeRevision:
      type: integer
      format: int64
      minimum: 0
    DecimalScore:
      type: number
      multipleOf: 0.01
      description: Fixed-point score in persistence; JSON number in transport.
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    UserStatus:
      type: string
      enum: [PENDING_CONTACT_BINDING, ACTIVE, LOCKED, DISABLED]
    SemesterTermCode:
      type: string
      enum: [FIRST, SECOND, SUMMER]
    SemesterStatus:
      type: string
      enum: [UPCOMING, CURRENT, ARCHIVED]
    CourseStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ClassSectionStatus:
      type: string
      enum: [UPCOMING, ACTIVE, CLOSED, ARCHIVED]
    CheckInWindowMode:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]
    CourseJoinGender:
      type: string
      enum: [MALE, FEMALE]
      description: Gender values accepted when a student joins a course by QR invite; OTHER remains available only in the broader historical profile and roster model.
    EnrollmentStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN, REMOVED]
    EnrollmentSource:
      type: string
      enum: [OFFICIAL_IMPORT, QR_CODE, MANUAL, SYSTEM_SYNC]
    RosterImportSource:
      type: string
      enum: [FILE, OFFICIAL_API]
    RosterFileFormat:
      type: string
      enum: [CSV]
    RosterImportStatus:
      type: string
      enum: [RECEIVED, VALIDATING, VALIDATED, FAILED]
    RosterRowValidationStatus:
      type: string
      enum: [VALID, INVALID, DUPLICATED]
    RosterAlignmentStatus:
      type: string
      enum: [MATCHED, MISSING_IN_PLATFORM, EXTRA_IN_PLATFORM, WRONG_COURSE, IDENTITY_CONFLICT, DUPLICATED]
    RosterResolutionStatus:
      type: string
      enum: [PENDING, CONFIRMED, RESOLVED, IGNORED]
    RosterAlignmentRunStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]
    RosterResolutionAction:
      type: string
      enum: [CONFIRM, RESOLVE, REOPEN]
    RosterResolutionEvidenceType:
      type: string
      enum: [NEW_ALIGNMENT_RESULT, ENROLLMENT_STATUS_EVENT, OFFICIAL_ROSTER_VERSION]
    RosterDifferenceField:
      type: string
      enum: [FULL_NAME, GENDER, GRADE_YEAR, CLASS_SECTION]
    ExerciseSessionStatus:
      type: string
      enum: [IN_PROGRESS, PAUSED, COMPLETED, CANCELLED, EXPIRED]
    SessionEndReason:
      type: string
      enum: [USER_COMPLETED, DURATION_LIMIT_REACHED, USER_CANCELLED, SESSION_EXPIRED]
    ExerciseRecordStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVIEWED, CANCELLED]
    ReviewResult:
      type: string
      enum: [VALID, INVALID]
    ReviewReasonCode:
      type: string
      enum: [INSUFFICIENT_EVIDENCE, INVALID_MEDIA, DURATION_INCONSISTENT, IDENTITY_MISMATCH, DUPLICATE_SUBMISSION, OUTSIDE_ALLOWED_SCOPE, OTHER]
    ScoreAdjustmentReasonCode:
      type: string
      enum: [VERIFIED_DATA_ERROR, APPROVED_POLICY_EXCEPTION, CALCULATION_ERROR]
    ScoreAdjustmentType:
