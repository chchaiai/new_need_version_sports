        sessionId: { $ref: '#/components/schemas/OpaqueId' }
        creditType: { $ref: '#/components/schemas/CreditType' }
        sportType: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        sportName: { type: [string, 'null'], maxLength: 100 }
        description:
          description: Student-authored explanation. Required and nonblank for GENERAL; optional for COURSE_RELATED, where omitted, null, or blank input is normalized to null.
