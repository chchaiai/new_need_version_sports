        expectedVersion: { $ref: '#/components/schemas/PositiveVersion' }
    CreateExerciseRecordResubmissionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, creditType, sportType, clientRequestId, expectedVersion]
      properties:
        sessionId: { $ref: '#/components/schemas/OpaqueId' }
        creditType: { $ref: '#/components/schemas/CreditType' }
        sportType: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        sportName: { type: [string, 'null'], maxLength: 100 }
        description:
          description: Student-authored explanation. Required and nonblank for GENERAL; optional for COURSE_RELATED, where omitted, null, or blank input is normalized to null.
          oneOf:
            - { type: string, minLength: 1, maxLength: 200 }
            - { type: 'null' }
        clientRequestId: { type: string, minLength: 1, maxLength: 64 }
        expectedVersion:
          $ref: '#/components/schemas/PositiveVersion'
