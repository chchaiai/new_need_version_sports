      allOf:
        - if:
            properties:
              creditType: { const: GENERAL }
            required: [creditType]
          then:
            properties:
              description: { type: string, minLength: 1, maxLength: 200, pattern: '.*\S.*' }
            required: [description]
    InitiateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [businessPurpose, mediaType, mimeType, fileSizeBytes, captureSource]
      properties:
        sessionId: { $ref: '#/components/schemas/OpaqueId' }
        enrollmentId: { $ref: '#/components/schemas/OpaqueId' }
        businessPurpose: { $ref: '#/components/schemas/MediaBusinessPurpose' }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        mimeType: { type: string, minLength: 1, maxLength: 127, enum: [image/jpeg, image/png, video/mp4, video/quicktime, video/3gpp, video/webm], x-transport-constraint: true, description: Untrusted transport declaration. The server verifies the actual bytes and container; clients must not substitute video/mp4 when the browser reports an empty or different MIME. }
        fileSizeBytes: { type: integer, minimum: 1, description: Exact upload length used for transport integrity. No business maximum applies to EXERCISE_RECORD VIDEO. }
        captureSource: { $ref: '#/components/schemas/CaptureSource', x-runtime-enum: [IN_APP_CAMERA, FILE_PICKER], description: EXERCISE_RECORD requires IN_APP_CAMERA. EXEMPTION_APPLICATION permits IN_APP_CAMERA or FILE_PICKER; SYSTEM_IMPORT is not accepted by this student endpoint. }
        declaredContentSha256: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }], description: Optional and untrusted client declaration; it is not an integrity fact. }
        durationSeconds: { type: [integer, 'null'], minimum: 1, description: Required and positive for VIDEO; omit or null for IMAGE. EXERCISE_RECORD VIDEO has a fixed maximum of 15 cumulative recorded seconds; pauses are excluded. Runtime validation enforces the media-type and purpose conditions. }
      oneOf:
        - properties:
            businessPurpose: { const: EXERCISE_RECORD }
            sessionId: { $ref: '#/components/schemas/OpaqueId' }
          required: [sessionId]
          not: { properties: { enrollmentId: {} }, required: [enrollmentId] }
        - properties:
            businessPurpose: { const: EXEMPTION_APPLICATION }
            enrollmentId: { $ref: '#/components/schemas/OpaqueId' }
          required: [enrollmentId]
          not: { properties: { sessionId: {} }, required: [sessionId] }
      allOf:
        - if:
            properties:
              businessPurpose: { const: EXERCISE_RECORD }
              mediaType: { const: VIDEO }
            required: [businessPurpose, mediaType]
          then:
            properties:
              durationSeconds: { type: integer, minimum: 1, maximum: 15 }
            required: [durationSeconds]
      description: EXERCISE_RECORD media is scoped to an owned ExerciseSession. EXEMPTION_APPLICATION media is scoped to an owned active Enrollment before atomic association with an application draft. No location permission or GPS data is required; uploaded JPEG/PNG/ISO/WebM media containing recognized location metadata is rejected.
    InitiateExemptionApplicationMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [mediaType, mimeType, fileSizeBytes, captureSource]
      properties:
        mediaType: { type: string, enum: [IMAGE], x-enum-subset-of: MediaType }
        mimeType: { type: string, minLength: 1, maxLength: 127, enum: [image/jpeg, image/png], x-transport-constraint: true, description: Untrusted image declaration; the server verifies the actual bytes. }
        fileSizeBytes: { type: integer, minimum: 1 }
        captureSource: { type: string, enum: [IN_APP_CAMERA, FILE_PICKER], x-transport-constraint: true }
        declaredContentSha256: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }], description: Optional untrusted client declaration. }
        durationSeconds: { type: [integer, 'null'], minimum: 1, description: Must be omitted or null for image material. }
      description: The applicationId, Enrollment, student, organization, and EXEMPTION_APPLICATION purpose are derived exclusively from the authorized path resource. Only JPEG and PNG images are accepted.
    ConfirmMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [etag]
      properties:
        etag: { type: string, minLength: 1, maxLength: 256 }
    BindMediaRequest:
      type: object
      additionalProperties: false
      required: [sessionId, expectedVersion]
      properties:
        sessionId: { $ref: '#/components/schemas/OpaqueId' }
        expectedVersion: { $ref: '#/components/schemas/PositiveVersion' }
      description: Stage 15 permits only binding to the same owned ExerciseSession. recordId is deliberately absent until ExerciseRecord exists.
    MediaAccessRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', x-runtime-enum: [VIEW_ORIGINAL] }
    CreateReviewRequest:
      type: object
      additionalProperties: false
      required: [result, expectedReviewVersion, expectedVersion]
      properties:
        result: { type: string, enum: [VALID, INVALID], x-enum-subset-of: ReviewResult }
        reasonCode: { oneOf: [{ $ref: '#/components/schemas/ReviewReasonCode' }, { type: 'null' }] }
        reason: { type: [string, 'null'], maxLength: 500 }
        publicComment: { type: [string, 'null'], maxLength: 1000 }
        internalNote: { type: [string, 'null'], maxLength: 2000 }
        creditedDurationOverrideSeconds:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeSeconds'
            - type: 'null'
          description: Omit or send null while ADR-047 is unresolved; a non-null value is rejected with REVIEW_CREDIT_OVERRIDE_NOT_APPROVED.
        expectedReviewVersion: { type: integer, minimum: 0 }
        expectedVersion: { $ref: '#/components/schemas/PositiveVersion' }
      allOf:
        - if:
            properties:
              result: { const: INVALID }
          then:
            required: [reasonCode]
            properties:
              reasonCode: { $ref: '#/components/schemas/ReviewReasonCode' }
        - if:
            required: [reasonCode]
            properties:
              reasonCode: { const: OTHER }
          then:
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500, pattern: '.*\S.*' }
    BatchReviewItem:
      type: object
      additionalProperties: false
      required: [itemKey, recordId, result, expectedReviewVersion, expectedVersion]
      properties:
        itemKey: { type: string, minLength: 1, maxLength: 128 }
        recordId: { $ref: '#/components/schemas/OpaqueId' }
        result: { type: string, enum: [VALID, INVALID], x-enum-subset-of: ReviewResult }
        reasonCode: { oneOf: [{ $ref: '#/components/schemas/ReviewReasonCode' }, { type: 'null' }] }
        reason: { type: [string, 'null'], maxLength: 500 }
        publicComment: { type: [string, 'null'], maxLength: 1000 }
        internalNote: { type: [string, 'null'], maxLength: 2000 }
        creditedDurationOverrideSeconds:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeSeconds'
            - type: 'null'
          description: Omit or send null while ADR-047 is unresolved; a non-null value is rejected with REVIEW_CREDIT_OVERRIDE_NOT_APPROVED.
        expectedReviewVersion: { type: integer, minimum: 0 }
        expectedVersion: { $ref: '#/components/schemas/PositiveVersion' }
      allOf:
        - if:
            properties:
              result: { const: INVALID }
          then:
            required: [reasonCode]
            properties:
              reasonCode: { $ref: '#/components/schemas/ReviewReasonCode' }
        - if:
            required: [reasonCode]
            properties:
              reasonCode: { const: OTHER }
          then:
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500, pattern: '.*\S.*' }
