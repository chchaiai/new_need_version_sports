        gender: { type: [string, 'null'], maxLength: 128 }
        gradeYear: { type: [string, 'null'], maxLength: 128 }
        collegeName: { type: [string, 'null'], maxLength: 128 }
        majorName: { type: [string, 'null'], maxLength: 128 }
