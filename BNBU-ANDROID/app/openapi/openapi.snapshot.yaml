openapi: 3.1.0
info:
  title: BNBU Sports Unified API
  version: 3.0.0-contract
  summary: Unified contract for the sports check-in platform
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  description: |
    Cross-client consistency candidate derived from the latest immutable published
    contract. It removes the exercise-review PENDING state, makes VALID/INVALID
    the only authoritative review results, enables organization-wide endurance
    conversion rules, and exposes the formal 60-minute session operation. It does
    not prove that every registered capability is
    business-enabled or production-ready.
    Business fields come from 02-data-dictionary.md, state transitions from
    03-state-machines.md, rules from 04-business-rules.md, and authorization
    from 05-permission-matrix.md. Foundation authentication/session persistence
    is approved; CourseInvite/Join Capability are contract-and-persistence-design
    only until the Enrollment Gate, while every Export operation is fail-closed
    and V1 persists no ExportJob. Of the 30 client-support operations added in
    Stage 21, authentication, exemption, release-policy, notification,
    push-device, preference, help, and feedback capabilities are approved for
    real local implementation, while unresolved capabilities remain explicit
    routed denials. GPS has persistence and
    application-layer foundations, but all six location HTTP operations remain
    denied. None of these statements proves Staging, iOS-binary, push-delivery,
    GPS-production, or Production-Gate readiness.
servers:
  - url: /api/v1
    description: Version 1 relative base path
security:
  - bearerAuth: []
x-authorization-invariants:
  teacherScope: ClassSection.teacherId must equal principal.teacherId; no assignment or inferred multi-teacher relation exists.
  rawAuditLogRead: ADMIN within the same organization only; TEACHER is denied.
  defaultDeny: Student enrollment withdrawal, submitted-record withdrawal, roster ignore, archived-score correction, unsupported student mutation, four Export operations, sport catalog, and six GPS/location operations are explicit routed denials. Locally implemented client-support operations are not Staging or production enablement. Student Course/ClassSection projection remains denied until an ACTIVE Enrollment can be resolved.
tags:
  - name: Health
    description: Public liveness and dependency-aware readiness probes.
  - name: System Mode
    description: Public safe projection of the current organization service mode.
  - name: Organizations
    description: Access-token scoped current-organization projection.
  - name: Semesters
    description: Access-token scoped current-semester projection.
  - name: Authentication
    description: Foundation password authentication, token rotation, and session termination contracts.
  - name: Current User
    description: The authenticated user's role and profile projection.
  - name: Students
    description: Student profile resources within one organization.
  - name: Teachers
    description: Teacher profile resources within one organization.
  - name: Courses
    description: Organization course catalog resources governed by ADMIN under accepted ADR-067.
  - name: Class Sections
    description: Semester-specific teaching sections owned by one teacher.
  - name: Enrollments
    description: Student membership in a class section.
  - name: QR Course Joining
    description: QR invitation preview and student join commands.
  - name: Official Roster Imports
    description: Official roster file intake and validation.
  - name: Roster Alignment
    description: Comparison and resolution between enrollments and official rosters.
  - name: Exercise Sessions
    description: Student exercise timing sessions and heartbeats.
  - name: Exercise Records
    description: Submitted student exercise records and their current review projection.
  - name: Media Uploads
    description: Direct-upload sessions and immutable media evidence metadata.
  - name: Exercise Reviews
    description: Teacher review decisions appended to exercise records.
  - name: Score Rules
    description: Versioned scoring rules; activation is disabled pending listed ADRs.
  - name: Student Scores
    description: Calculated and published student score revisions.
  - name: Score Adjustments
    description: Audited score adjustments and correction commands.
  - name: Exports
    description: Registered transport shapes whose operations remain fail-closed; V1 persists no ExportJob.
  - name: Audit Logs
    description: Organization-scoped raw audit events available only to administrators.
  - name: Client Capabilities
    description: Contract-first client support capabilities include authentication and recovery, messaging, exemption applications, and organization-wide activity-conversion rules. Governance-blocked capabilities remain stable default-deny. Local implementation is not Staging or production enablement.
  - name: Notifications
    description: Role-scoped notification inbox and push-device registration contracts.
  - name: Exemption Applications
    description: Student applications and responsible-teacher review contracts; no workflow is active yet.
  - name: Location Evidence
    description: Consent-bound exercise GPS intake and coarse Record summary contracts; collection is disabled pending privacy and retention approval.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getHealthLive
      x-access-policy:
        policyId: PUBLIC-HEALTH-LIVE
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: NONE
        resourceResolver: NONE
        defaultDeny: true
      summary: Report whether the application process is alive
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/HealthSuccess'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [Health]
      operationId: getHealthReady
      x-access-policy:
        policyId: PUBLIC-HEALTH-READY
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: NONE
        resourceResolver: NONE
        defaultDeny: true
      summary: Report whether required Foundation dependencies are ready
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/HealthSuccess'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/admin:
    get:
      tags: [Health]
      operationId: getAdminHealth
      x-access-policy:
        policyId: ADMIN-HEALTH-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ORGANIZATION
        resourceResolver: PRINCIPAL_ORGANIZATION
        defaultDeny: true
      summary: Read dependency-aware operational health as an administrator
      description: Returns safe dependency categories, status, latency, and notification backlog without exposing endpoints, credentials, or storage keys.
      x-allowed-roles: [ADMIN]
      x-default-deny-error: PERMISSION_DENIED
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/AdminHealthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /system-mode:
    get:
      tags: [System Mode]
      operationId: getSystemMode
      x-access-policy:
        policyId: PUBLIC-SYSTEM-MODE-READ
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: NONE
        resourceResolver: NONE
        defaultDeny: true
      summary: Read the safe public SystemMode projection
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/SystemModeSuccess'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organizations/current:
    get:
      tags: [Organizations]
      operationId: getCurrentOrganization
      x-access-policy:
        policyId: ORGANIZATION-CURRENT-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ORGANIZATION
        resourceResolver: PRINCIPAL_ORGANIZATION
        defaultDeny: true
      summary: Read the authenticated principal's organization
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /semesters/current:
    get:
      tags: [Semesters]
      operationId: getCurrentSemester
      x-access-policy:
        policyId: SEMESTER-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ORGANIZATION
        resourceResolver: PRINCIPAL_ORGANIZATION
        defaultDeny: true
      summary: Read the current semester in the authenticated principal's organization
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/SemesterSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-login:
    post:
      tags: [Authentication]
      operationId: passwordLogin
      x-access-policy:
        policyId: AUTH-PASSWORD-LOGIN
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: NONE
        resourceResolver: NONE
        defaultDeny: true
      summary: Authenticate with an approved password credential
      description: Foundation password login for pre-provisioned TEACHER/ADMIN accounts; TTL values come from environment configuration and arbitrary-password or role-guessing login is forbidden.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
            example:
              account: teacher@example.edu
              password: example-only-not-a-real-password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
              example:
                data:
                  sessionId: ses_auth_01JABC123
                  accessToken: eyJhbGciOiJIUzI1NiJ9.example
                  refreshToken: opaque-refresh-token
                  tokenType: Bearer
                  accessTokenExpiresAt: '2026-08-02T02:20:00Z'
                  refreshTokenExpiresAt: '2026-08-09T02:05:00Z'
                  user:
                    id: usr_01JABC123
                    organizationId: org_bnbu
                    role: TEACHER
                    status: ACTIVE
                    primaryEmailMasked: t***@example.edu
                    emailVerified: true
                    version: 4
                meta:
                  requestId: req_01JABC123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      x-access-policy:
        policyId: AUTH-REFRESH
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: SESSION
        resourceResolver: REFRESH_TOKEN
        defaultDeny: true
      summary: Rotate a refresh token and issue a new access token
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutSession
      x-access-policy:
        policyId: AUTH-LOGOUT
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SESSION
        resourceResolver: AUTHENTICATED_SESSION
        defaultDeny: true
      summary: Revoke the current or selected owned session
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Current User]
      operationId: getCurrentUser
      x-access-policy:
        policyId: USER-SELF-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SELF
        resourceResolver: PRINCIPAL_USER
        defaultDeny: true
      summary: Get the authenticated User and role-specific Profile projection
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/email-verification-challenges:
    post:
      tags: [Current User, Authentication]
      operationId: requestCurrentUserEmailChallenge
      x-access-policy:
        policyId: USER-EMAIL-VERIFY-REQUEST
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SELF
        resourceResolver: PRINCIPAL_USER
        defaultDeny: true
      summary: Request first email binding or a verified email change
      description: First binding sends one code to the new email. Rebinding sends separate codes to both the currently verified email and the new email. No phone or SMS channel is accepted.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationChallengeRequest'
      responses:
        '202':
          $ref: '#/components/responses/EmailVerificationChallengeAcceptedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/email-verification-challenges/{challengeId}/verify:
    post:
      tags: [Current User, Authentication]
      operationId: verifyCurrentUserEmailChallenge
      x-access-policy:
        policyId: USER-EMAIL-VERIFY-COMPLETE
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SELF
        resourceResolver: PRINCIPAL_USER
        defaultDeny: true
      summary: Verify and bind the requested email
      description: Rebinding requires both the current-email code and new-email code. Success revokes the user's other active sessions while preserving the calling session.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailChallengeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/account-deletion-challenges:
    post:
      tags: [Current User, Authentication]
      operationId: requestCurrentUserAccountDeletionChallenge
      x-error-codes: [ACCOUNT_DELETION_REAUTH_REQUIRED, ACCOUNT_DELETION_ACTIVE_SESSION, ACCOUNT_DELETION_PENDING_REVIEW, CONFLICT_VERSION_MISMATCH]
      x-access-policy:
        policyId: USER-ACCOUNT-DELETE-REQUEST
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SELF
        resourceResolver: PRINCIPAL_USER
        defaultDeny: true
      summary: Start the required reauthentication step for account deletion
      description: Students receive a one-time code at the currently verified email. Teachers and administrators must provide the current password. The operation never deletes or overwrites historical business records.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeletionChallengeRequest' }
      responses:
        '202': { $ref: '#/components/responses/AccountDeletionChallengeAcceptedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/account-deletion-challenges/{challengeId}/confirm:
    post:
      tags: [Current User, Authentication]
      operationId: confirmCurrentUserAccountDeletion
      x-error-codes: [ACCOUNT_DELETION_REAUTH_REQUIRED, ACCOUNT_DELETION_ACTIVE_SESSION, ACCOUNT_DELETION_PENDING_REVIEW, CONFLICT_VERSION_MISMATCH]
      x-access-policy:
        policyId: USER-ACCOUNT-DELETE-CONFIRM
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: SELF
        resourceResolver: PRINCIPAL_USER
        defaultDeny: true
      summary: Atomically disable and de-identify the current account
      description: A valid challenge is consumed in the same transaction that disables the User, increments tokenVersion, revokes every AuthSession and RefreshToken, detaches every PushDevice, and de-identifies the role Profile. Immutable business and audit facts keep their foreign keys. A later registration always creates a new User.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAccountDeletionRequest' }
      responses:
        '200': { $ref: '#/components/responses/AccountDeletionSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /students:
    get:
      tags: [Students]
      operationId: listStudents
      x-access-policy:
        policyId: STUDENT-LIST
        authentication: ACCESS_TOKEN
        allowedRoles: [TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ROLE_SCOPED
        resourceResolver: STUDENT_LIST_SCOPE
        defaultDeny: true
      summary: List authorized student profile projections
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          x-runtime-enum: [fullName, -fullName, studentNumber, -studentNumber, createdAt, -createdAt]
          schema: { type: string, maxLength: 200 }
          description: Open Contract 1.3 string retained for input compatibility; runtime accepts only x-runtime-enum values.
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ClassSectionFilter'
        - name: status
          in: query
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      responses:
        '200':
          $ref: '#/components/responses/StudentListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Students]
      operationId: getStudent
      x-access-policy:
        policyId: STUDENT-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ROLE_SCOPED
        resourceResolver: STUDENT_FROM_PATH
        defaultDeny: true
      summary: Get an authorized student projection
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/StudentSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Students]
      operationId: updateStudent
      x-access-policy:
        policyId: STUDENT-UPDATE
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ROLE_SCOPED
        resourceResolver: STUDENT_FROM_PATH
        defaultDeny: true
      summary: Update authorized student profile fields
      description: Transport placeholder only; returns SYSTEM_MODE_UNSUPPORTED until field-level ownership for student self-service and organization governance is approved. Teachers never gain StudentProfile write authority from this route.
      x-enabled-by-default: false
      x-business-blocker: STUDENT_PROFILE_FIELD_GOVERNANCE
      x-default-deny-error: SYSTEM_MODE_UNSUPPORTED
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          $ref: '#/components/responses/StudentSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /teachers/{teacherId}:
    get:
      tags: [Teachers]
      operationId: getTeacher
      x-access-policy:
        policyId: TEACHER-READ
        authentication: ACCESS_TOKEN
        allowedRoles: [STUDENT, TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ROLE_SCOPED
        resourceResolver: TEACHER_FROM_PATH
        defaultDeny: true
      summary: Get an authorized teacher projection
      parameters:
        - $ref: '#/components/parameters/TeacherId'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          $ref: '#/components/responses/TeacherSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teachers/{teacherId}/class-sections:
    get:
      tags: [Teachers, Class Sections]
      operationId: listTeacherClassSections
      x-access-policy:
        policyId: TEACHER-CLASS-SECTION-LIST
        authentication: ACCESS_TOKEN
        allowedRoles: [TEACHER, ADMIN]
        organizationScope: PRINCIPAL_ORGANIZATION
        resourceScope: ROLE_SCOPED
        resourceResolver: TEACHER_FROM_PATH
        defaultDeny: true
      summary: List class sections whose teacherId equals the requested teacher within the caller scope
