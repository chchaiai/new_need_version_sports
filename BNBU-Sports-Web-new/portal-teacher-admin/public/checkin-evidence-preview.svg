    <text x="25" y="91" fill="white" font-family="Arial, sans-serif" font-size="43" font-weight="700">02:01:00</text>
    <text x="25" y="126" fill="#9ec6f6" font-family="Arial, sans-serif" font-size="18">校园跑 · 2026-07-27</text>
