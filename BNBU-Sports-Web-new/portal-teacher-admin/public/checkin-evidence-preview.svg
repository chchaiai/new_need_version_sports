      <stop offset="1" stop-color="#7eb6e3"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e55e52"/>
      <stop offset="1" stop-color="#b9363f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#sky)"/>
  <rect y="315" width="960" height="325" fill="#6fa66c"/>
  <path d="M0 363C160 300 278 385 434 342S744 266 960 326V640H0Z" fill="#4c8d55" opacity=".58"/>
  <ellipse cx="485" cy="454" rx="315" ry="133" fill="url(#track)"/>
  <ellipse cx="485" cy="454" rx="242" ry="83" fill="#77b86c"/>
  <ellipse cx="485" cy="454" rx="171" ry="45" fill="#65a962"/>
  <g fill="none" stroke="#fff" stroke-width="4" opacity=".58">
    <ellipse cx="485" cy="454" rx="286" ry="115"/>
    <ellipse cx="485" cy="454" rx="259" ry="99"/>
  </g>
  <g fill="#f6df78">
    <circle cx="150" cy="283" r="42"/><circle cx="245" cy="258" r="30"/><circle cx="808" cy="268" r="38"/><circle cx="888" cy="300" r="33"/>
  </g>
  <g fill="#7f6344">
    <rect x="145" y="283" width="10" height="81"/><rect x="240" y="258" width="9" height="74"/><rect x="803" y="268" width="9" height="81"/><rect x="883" y="300" width="9" height="58"/>
  </g>
  <g transform="translate(604 74)">
