          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - INVALID_CREDENTIALS
      - ACCOUNT_DISABLED
      - INVALID_REQUEST
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSessionRequest'
  /auth/sessions/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh credential
      description: Consumes the current opaque refresh credential and returns a new access/refresh pair. Reuse of a rotated
        credential is rejected.
      operationId: refreshSession
      security: []
      x-roles:
      - ANONYMOUS
      x-admin-permissions: []
      x-resource-scope: REFRESH_SESSION_OWNER
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - INVALID_CREDENTIALS
      - TOKEN_EXPIRED
      - ACCOUNT_DISABLED
      - INVALID_REQUEST
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
  /auth/sessions/current/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the current login session
      description: Revokes the current session. Repeating the command returns the committed revocation result.
      operationId: logoutCurrentSession
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      - TEACHER
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: CURRENT_SESSION
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /auth/sessions/logout-all:
    post:
      tags:
      - Authentication
      summary: Revoke all sessions for the current account
      description: Revokes every still-valid session owned by the authenticated account.
      operationId: logoutAllSessions
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      - TEACHER
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: CURRENT_ACCOUNT
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
