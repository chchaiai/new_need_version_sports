    FinalizeMediaRequest:
      type: object
      additionalProperties: false
      properties:
        clientChecksumSha256:
          anyOf:
          - type: string
            description: Hex-encoded SHA-256 checksum.
            pattern: ^[A-Fa-f0-9]{64}$
          - type: 'null'
      required:
      - clientChecksumSha256
      description: The checksum is an optional client integrity assertion. Backend/COS probing remains authoritative.
    MediaFinalizationRejectionCode:
      type: string
      description: Stable expected finalization outcome. These values are returned only inside a 200 terminal MediaAsset;
        transport, authorization, dependency, and internal failures remain ErrorEnvelope responses.
      enum:
      - MEDIA_ALLOCATION_EXPIRED
      - MEDIA_CONTENT_INVALID
      - MEDIA_LIMIT_EXCEEDED
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
    MediaAsset:
      type: object
      additionalProperties: false
      properties:
        mediaAssetId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mediaKind:
          type: string
          enum:
          - IMAGE
          - VIDEO
        contentType:
          anyOf:
          - type: string
            enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
          - type: 'null'
        byteSize:
          anyOf:
          - type: integer
            format: int64
            minimum: 1
          - type: 'null'
        checksumSha256:
          anyOf:
          - type: string
            description: Hex-encoded SHA-256 checksum.
            pattern: ^[A-Fa-f0-9]{64}$
          - type: 'null'
        durationMilliseconds:
          anyOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
        hasAudio:
          anyOf:
          - type: boolean
          - type: 'null'
        widthPixels:
          anyOf:
          - type: integer
            format: int32
            minimum: 1
          - type: 'null'
        heightPixels:
          anyOf:
          - type: integer
            format: int32
            minimum: 1
          - type: 'null'
        status:
          type: string
          enum:
          - ALLOCATED
          - UPLOADED
          - VERIFIED
          - BOUND
          - REJECTED
          - EXPIRED
        rejectionCode:
          anyOf:
          - $ref: '#/components/schemas/MediaFinalizationRejectionCode'
          - type: 'null'
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version.
          minimum: 0
      required:
      - mediaAssetId
      - purpose
      - mediaKind
      - contentType
      - byteSize
      - checksumSha256
      - durationMilliseconds
      - hasAudio
      - widthPixels
      - heightPixels
      - status
      - rejectionCode
      - version
      description: rejectionCode is non-null for REJECTED, equals MEDIA_ALLOCATION_EXPIRED for EXPIRED, and is null for ALLOCATED,
        UPLOADED, VERIFIED, and BOUND.
      allOf:
      - if:
          properties:
            status:
              const: REJECTED
          required:
          - status
        then:
          properties:
            rejectionCode:
              type: string
              enum:
              - MEDIA_CONTENT_INVALID
              - MEDIA_LIMIT_EXCEEDED
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
      - if:
          properties:
            status:
              const: EXPIRED
          required:
          - status
        then:
          properties:
            rejectionCode:
              type: string
              const: MEDIA_ALLOCATION_EXPIRED
      - if:
          properties:
            status:
              enum:
              - ALLOCATED
              - UPLOADED
              - VERIFIED
              - BOUND
          required:
          - status
        then:
          properties:
            rejectionCode:
              type: 'null'
