      description: One-flow sensitive proof bound to the server-registered anonymous flow, not proof of email/account identity.
        Persist only non-reversible/secure replay material, never raw proof in logs or URLs. Does not create login rights;
        exact replay only with original nonce subject, expires with original flow and cannot refresh grace.
    SettlementSourceReference:
