      additionalProperties: false
      properties:
        zh:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
      required:
      - zh
      - en
    PersonSummary:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        displayName:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - STUDENT
          - TEACHER
          - ADMIN
      required:
      - userId
      - displayName
      - role
    ActorRole:
      type: string
      enum:
      - STUDENT
      - TEACHER
      - ADMIN
    AdminKind:
      type: string
      enum:
      - SUPER
      - SUB
    AdminPermission:
      type: string
      enum:
      - COURSE_VIEW
      - SEMESTER
      - USERS_ACCOUNTS
      - FEEDBACK
      - GLOBAL_RULES
      - SYSTEM_MODE
      - HELP_CENTER
      - AUDIT_QUERY
    AuthChallengePurpose:
      type: string
      enum:
      - STUDENT_LOGIN
      - STUDENT_EMAIL_BINDING
      - PASSWORD_RESET
      - CURRENT_EMAIL_VERIFICATION
      - NEW_EMAIL_VERIFICATION
      - ACCOUNT_DELETION
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/AuthChallengePurpose'
        email:
          type: string
          description: Normalized school email address.
          minLength: 3
          format: email
      required:
      - purpose
      - email
      description: Requests an email OTP challenge. The response must not disclose whether an account exists.
    AuthChallenge:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        expiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 0
      required:
      - challengeId
      - expiresAt
      - retryAfterSeconds
    OtpProof:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        code:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - challengeId
      - code
    StudentSessionRequest:
      type: object
      additionalProperties: false
      properties:
