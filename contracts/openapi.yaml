          maximum: 1200
        completionRatio:
          type: number
          minimum: 0
          maximum: 1
        displayPercent:
          type: integer
          format: int64
          minimum: 0
          maximum: 100
        targetMet:
          type: boolean
        actualDurationSeconds:
          type: number
          minimum: 0
        countedRecordMinutes:
          type: integer
          format: int64
          minimum: 0
        countedCertificationMinutes:
          type: integer
          format: int64
          minimum: 0
        invalidActualMinutes:
          type: integer
          format: int64
          minimum: 0
        validUncountedEligibleMinutes:
          type: integer
          format: int64
          minimum: 0
        validFormulaExcludedMinutes:
          type: integer
          format: int64
          minimum: 0
        pendingRecordCount:
          type: integer
          format: int64
