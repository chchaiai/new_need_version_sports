        expiry projection. Unknown, malformed, or unsafe-to-project codes use INVITATION_INVALID instead.
      allOf:
      - if:
          properties:
            newRegistrationAllowed:
              const: true
          required:
          - newRegistrationAllowed
        then:
          properties:
            status:
              type: string
              const: ACTIVE
            unavailableReason:
              type: 'null'
      - if:
          properties:
            newRegistrationAllowed:
              const: false
          required:
          - newRegistrationAllowed
        then:
          properties:
            unavailableReason:
              type: string
              enum:
              - EXPIRED
              - REVOKED
              - JOIN_CLOSED
              - COURSE_CLOSED
