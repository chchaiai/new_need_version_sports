        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset a teacher or administrator password
      description: Consumes valid PASSWORD_RESET proof for the account holder's verified school email and sets that holder's
        final personal password. Success clears mustChangePassword, revokes every prior session, returns no token, and does
        not automatically log in. A proof-resolved DISABLED account returns ACCOUNT_DISABLED without changing its credential,
        gate, or access state; challenge issuance keeps its anti-enumeration behavior.
      operationId: resetPassword
      security: []
      x-roles:
      - ANONYMOUS
      x-admin-permissions: []
      x-resource-scope: VERIFIED_ACCOUNT_EMAIL
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - INVALID_CREDENTIALS
      - CHALLENGE_EXPIRED
      - ACCOUNT_DISABLED
      - INVALID_REQUEST
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
