      - expectedCaseVersion
      - expectedTimerVersion
      - roundNo
      - materialVersionId
      - originalBudgetHours
      - restoredRemainingSeconds
      - entryRestoredAt
      - restoredStage
      - supplementReturnUsed
      - createdAt
      description: Read-only public explanation of an authorized append-only correction, not an admin unlock request. Preserve
        original terminal and legal successors. No elapsed seconds accrue while the erroneous lock still prevents entry. An
        accepted later decision/settlement/correction conflict must fail targeted publication, not be overwritten.
      allOf:
      - if:
          properties:
            originalBudgetHours:
              enum:
              - 24
          required:
          - originalBudgetHours
        then:
          properties:
            restoredRemainingSeconds:
              type: number
              minimum: 0
              maximum: 86400
    RecordReview:
