x-historical-students:
  decision: P7-Z-CR-HISTORICAL-STUDENT-01
  current: CURRENT_STUDENT means a current account exists, including PENDING; it does not mean active enrollment.
  deleted: Only authoritative confirmed deletion yields DELETED_STUDENT. Missing data or unavailable dependencies must fail
    using the operation error policy, never masquerade as deletion. Use one consistent identity snapshot per response.
  identity: Reuse the previously public opaque studentId. No internal database key, credentials, deletion time or current-profile
    PII.
  authorization: Historical identity grants no login, restoration or command permission. Existing actor, role, resource ownership
    and system-mode gates remain.
  currentOnly:
  - StudentAccount.student
  - StudentDashboard.student
  currentEndpointRule: Student-owned endpoints require a current authenticated student and return CURRENT_STUDENT in their
    nested references. No deleted-account dashboard or self-service access.
  enrollment: Account deletion does not change ACTIVE/REMOVED membership or remove a retained relationship, list item or historical
    count.
  roster: Linked DELETED_STUDENT display rows have null rosterName/rosterStudentNumber. A formerly MATCHED_VERIFIED_JOINED
    row becomes NOT_REGISTERED_OR_JOINED in the current reconciliation and is not counted complete. Retain the confirmed identity
    denominator and historical relationship. Existing OUTSIDE_ROSTER and unresolved-identity distinctions remain. Frozen reports/grades/checkpoints
    are not recalculated.
  originals: Retain immutable school roster originals and necessary business evidence under existing restricted access/retention
    rules. Never use these originals to repopulate a current profile. This CR does not authorize deleting user-authored historical
    business content.
  feedback: DELETED_STUDENT implies currentVerifiedEmail=null.
  copies: Historical reads, exports, stored response copies and caches must use the deletion-aware identity projection. Clear
    derived current-profile copies at deletion; enforce an authoritative read barrier so stale caches cannot disclose deleted
    profile data. Restore procedures must reapply deletion facts.
  replay: After authorization, replay the original committed business result without re-executing the command or recomputing
    facts, versions, checkpoints or minutes. The sole identity-display exception is that a confirmed deleted student is projected
    as DELETED_STUDENT and current-profile copies/email/linked roster display names are redacted under x-historical-students.
    This exception overrides exact response-byte replay for those identity fields only; it never restores credentials or deleted
    personal data.
  backendAcceptance: Real PostgreSQL/HTTP, authorization, Session/deletion concurrency, derived-copy cleanup and rollback
    atomicity require H/Z integrated evidence; schema/Mock tests do not prove these.
