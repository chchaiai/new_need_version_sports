      - userId
      - organizationId
      - role
      - displayName
      - verifiedEmail
      - accountState
      - adminKind
      - adminPermissions
      - mustChangePassword
      - version
    SessionTokenPair:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          format: password
        accessExpiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        refreshToken:
          type: string
          minLength: 1
          format: password
        refreshExpiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        actor:
          $ref: '#/components/schemas/CurrentActor'
      required:
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      - actor
      description: Short-lived bearer access token plus a rotating opaque refresh token. Clients use platform secure storage.
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          format: password
          writeOnly: true
      required:
      - refreshToken
    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        otpProof:
          $ref: '#/components/schemas/OtpProof'
        newPassword:
          type: string
          minLength: 1
          writeOnly: true
      required:
