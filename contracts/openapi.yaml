    DirectUploadHttpMethod:
      type: string
      description: HTTP method covered by every short-lived direct-upload authorization in this Contract version.
      enum:
      - PUT
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - field
      - reason
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldViolations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        currentVersion:
          anyOf:
          - type: integer
            format: int64
            description: Optimistic-concurrency version.
            minimum: 0
          - type: 'null'
        retryAfterSeconds:
          anyOf:
          - type: integer
            format: int32
            minimum: 0
          - type: 'null'
        blockers:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - fieldViolations
      - currentVersion
      - retryAfterSeconds
      - blockers
      description: Safe structured details. Arrays are empty when no values apply; the entire details property may instead
        be null.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Localized human-readable message; clients branch only on code.
          minLength: 1
        requestId:
          type: string
          description: Correlation identifier safe to provide to support.
          minLength: 1
        details:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetails'
          - type: 'null'
      required:
      - code
      - message
      - requestId
      - details
      example:
        code: COURSE_ALREADY_JOINED
        message: 你已经加入该课程
        requestId: req_xxx
        details: null
    CursorPage:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        previousCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - limit
      - nextCursor
      - previousCursor
      description: Keyset pagination metadata. A null cursor means that direction has no more results.
    CommandAccepted:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
      required:
      - accepted
    DeletionResult:
      type: object
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          const: true
        retainedFacts:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - deleted
      - retainedFacts
    LocalizedText:
