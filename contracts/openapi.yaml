      - EMAIL_ALREADY_IN_USE
      - VERSION_CONFLICT
      - INVALID_REQUEST
      - FIRST_PASSWORD_CHANGE_REQUIRED
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - SYSTEM_MAINTENANCE
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
