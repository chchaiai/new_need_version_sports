          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: Optimistic concurrency precondition failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Payload or authoritative file size exceeds a declared limit.
