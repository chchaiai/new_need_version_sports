              - TECHNICAL_PROCESSING
              - TEACHER_REVIEW_REQUIRED
              - SUPPLEMENT_REQUIRED
              - SUPPLEMENT_REVIEW_REQUIRED
              - VALID
              - INVALID
          required:
          - processingStage
        then:
          properties:
            reviewCaseId:
              type: string
              description: Opaque public identifier; clients must not infer meaning from it.
              format: uuid
            roundNo:
              type: integer
              enum:
              - 1
              - 2
      - if:
          properties:
            processingStage:
              enum:
              - SUPPLEMENT_REQUIRED
              - SUPPLEMENT_REVIEW_REQUIRED
          required:
          - processingStage
        then:
          properties:
            supplementReturnUsed:
