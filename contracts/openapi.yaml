          anyOf:
          - $ref: '#/components/schemas/StatisticsCheckpoint'
          - type: 'null'
        unavailableReason:
          anyOf:
          - type: string
            enum:
            - SOURCE_INCOMPLETE
            - SOURCE_CHANGED
            - PREDECESSOR_UNAVAILABLE
            - RECOVERY_REQUIRED
          - type: 'null'
        observedAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
      required:
      - courseId
      - enrollmentId
      - student
      - state
      - checkpoint
      - unavailableReason
      - observedAt
      description: CURRENT means checkpoint covers current protected sources. RECOMPUTING may expose the last committed checkpoint
        explicitly as historical. UNAVAILABLE returns no numeric fallback. Session eligibility is independently checked by
        the Session Owner; target/daily/weekly cap never closes a start.
      allOf:
      - if:
          properties:
            state:
              const: CURRENT
          required:
          - state
        then:
          properties:
            checkpoint:
              $ref: '#/components/schemas/StatisticsCheckpoint'
            unavailableReason:
              type: 'null'
      - if:
          properties:
            state:
              const: RECOMPUTING
          required:
          - state
        then:
          properties:
            unavailableReason:
              type: string
              const: SOURCE_CHANGED
      - if:
          properties:
            state:
              const: UNAVAILABLE
          required:
          - state
        then:
          properties:
            checkpoint:
              type: 'null'
            unavailableReason:
              type: string
              enum:
              - SOURCE_INCOMPLETE
              - PREDECESSOR_UNAVAILABLE
              - RECOVERY_REQUIRED
