openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: BNBU Sports API
  version: 1.4.0-contract
  summary: The single external communication contract for Android, Web, and Backend.
  description: 'Public release line `/api/v1`. This Contract specifies API-boundary behavior only: generated DTOs belong in
    API or Contract adapters, operationId names application use cases, domain errors are mapped to stable Contract errors,
    and ORM entities are never generated from or exposed by this document.'
  x-contract-status: RC
servers:
- url: /api/v1
  description: Versioned API base path; environment origin is supplied by deployment configuration.
tags:
- name: Authentication
  description: OTP, password, refresh-token, and session use cases.
- name: Identity
  description: Current identity, verified-email change, and account deletion.
- name: Semesters
  description: Administrator-controlled academic semester state.
- name: Courses
  description: Course creation, controlled changes, impact checks, and closure.
- name: Enrollment
  description: Invitation-driven student registration and course membership.
- name: Rosters
  description: Teacher roster import, findings, resolution, and rollback.
- name: Exercise sessions
  description: Server-clock exercise-session state transitions.
- name: Media evidence
  description: Purpose-bound allocation, authoritative verification, and authorized download.
- name: Exercise records
  description: Immutable record submission and appended teacher reviews.
- name: Statistics
  description: Student and teacher progress projections derived from confirmed facts.
- name: Applications
  description: Exemption and certification application workflows.
- name: Endurance
  description: Measured endurance outcomes and versioned conversion-rule tables.
- name: Final grades
  description: Teacher publication and correction of signed-int32 final grades.
- name: Feedback
  description: Student feedback submission and administrator public replies.
- name: Help center
  description: Bilingual help-article authoring, publication, and retrieval.
- name: Notifications
  description: In-app notification list and read acknowledgement.
- name: Audit
  description: Permission-aware audit search and asynchronous ZIP export.
- name: Accounts
  description: Teacher, student, and sub-administrator account governance.
- name: Dashboards
  description: Role-specific aggregate views without client-side rule reconstruction.
- name: Admin governance
  description: System-mode and other fixed-permission administrative controls.
- name: System
  description: Public release policy and fail-closed system-mode observation.
paths:
  /auth/challenges:
    post:
      tags:
      - Authentication
      summary: Request an email verification challenge
      description: Creates a purpose-scoped OTP challenge without revealing whether the target account exists.
      operationId: requestAuthChallenge
      security: []
      x-roles:
      - ANONYMOUS
      - STUDENT
      - TEACHER
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: TARGET_EMAIL_WITH_ANTI_ENUMERATION
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - RATE_LIMITED
      - INVALID_REQUEST
      - IDEMPOTENCY_KEY_REUSED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '202':
          description: Challenge request accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
  /auth/sessions/student:
    post:
      tags:
      - Authentication
      summary: Create a student session with a verified email OTP
      description: Consumes a STUDENT_LOGIN challenge and returns rotating session credentials.
      operationId: createStudentSession
      security: []
      x-roles:
      - ANONYMOUS
      x-admin-permissions: []
      x-resource-scope: VERIFIED_STUDENT_EMAIL
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - INVALID_CREDENTIALS
      - CHALLENGE_EXPIRED
      - ACCOUNT_DISABLED
      - INVALID_REQUEST
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSessionRequest'
  /auth/sessions/password:
    post:
      tags:
      - Authentication
      summary: Create a teacher or administrator password session
      description: Authenticates a teacher by verified school email or an administrator by the declared identifier type.
      operationId: createPasswordSession
      security: []
      x-roles:
