x-public-conventions:
  pagination: Opaque keyset cursors only. Cursors are bound to the operation and normalized filters; clients must not parse
    them. Lists return items plus CursorPage. Operation-specific limits are authoritative.
  time: Instants are RFC 3339 UTC strings with explicit Z. Calendar dates use YYYY-MM-DD and retain their declared business
    timezone semantics; exercise businessDate is fixed by server time in Asia/Shanghai.
  nulls: Response properties are required unless the schema says otherwise. A required nullable property is present with null
    when no value exists; arrays are present and empty. Request omission and explicit null are distinct, additional properties
    are rejected, and null is accepted only where declared.
  uploads: Clients first allocate with declared metadata, use the response's required uploadMethod (PUT), exact requiredHeaders,
    and byte body against the short-lived least-privilege URL, then finalize or import. Backend probing of type, size, checksum,
    duration, audio, and structure is authoritative. Internal object keys and permanent public URLs are never exposed.
  idempotency: Commands marked REQUIRED_HEADER require Idempotency-Key. Natural idempotency is described per operation. Read-only
    operations require no key.
  authentication: Bearer access tokens authenticate protected operations. Roles, fixed administrator permissions, resource
    scope, and fail-closed system-mode requirements are declared on every operation.
x-upload-policies:
  RECORD_EVIDENCE:
    flow:
    - ALLOCATE
    - DIRECT_UPLOAD
    - FINALIZE_AND_PROBE
    - BIND_ON_RECORD_SUBMISSION
    image:
      contentTypes:
      - image/jpeg
      - image/png
      maximumCount: 6
      maximumBytesEach: 10485760
    video:
      contentTypes:
      - video/mp4
      maximumCount: 1
      maximumBytesEach: 104857600
      durationSeconds:
        minimum: 1
        maximum: 15
      audioRequired: true
    aggregateMinimumCount: 1
    aggregateMaximumCount: 7
    aggregateMaxBytes: 262144000
  APPLICATION_EVIDENCE:
    flow:
    - ALLOCATE
    - DIRECT_UPLOAD
    - FINALIZE_AND_PROBE
    - BIND_ON_INITIAL_OR_SUPPLEMENT_SUBMISSION
    contentTypes:
    - image/jpeg
    - image/png
    - image/webp
    maximumBytesEach: 10485760
    aggregateMaxCount: 3
    aggregateScope: Initial submission plus every supplement for the same application.
  ROSTER_SOURCE:
    flow:
    - ALLOCATE
    - DIRECT_UPLOAD
    - IMPORT_AND_PARSE
    contentTypes:
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    maximumBytes: 104857600
    dataRowMaximum: 500
    rowCounting: Header excluded; invalid and duplicate data rows included.
    retention: Temporary source discarded after parsing; formal snapshot stores normalized facts only.
x-error-catalog:
  INVALID_REQUEST:
    status: 400
    description: Request shape, syntax, or cross-field combination is invalid.
  INVALID_CURSOR:
    status: 400
    description: The opaque pagination cursor is invalid or no longer applicable.
  AUTHENTICATION_REQUIRED:
    status: 401
    description: A valid authenticated session is required.
  INVALID_CREDENTIALS:
    status: 401
    description: The supplied password, OTP, or refresh credential is invalid.
  TOKEN_EXPIRED:
    status: 401
    description: The access or refresh credential has expired.
  CHALLENGE_EXPIRED:
    status: 401
    description: The verification challenge has expired or was already consumed.
  ACCOUNT_DISABLED:
    status: 403
    description: The authenticated account or the account resolved from valid recovery proof is disabled.
  FIRST_PASSWORD_CHANGE_REQUIRED:
    status: 403
    description: A teacher or administrator must replace a temporary initial password before other role business use cases.
  FORBIDDEN:
    status: 403
    description: The actor lacks the required role, permission, ownership, or organization scope.
  RESOURCE_NOT_FOUND:
    status: 404
    description: The resource does not exist in the actor's authorized scope.
  IDEMPOTENCY_KEY_REUSED:
    status: 409
    description: The same idempotency key was reused with a different normalized command.
  VERSION_CONFLICT:
    status: 412
    description: The expected version is stale; reload the latest representation.
  VALIDATION_FAILED:
    status: 422
    description: The request is well formed but violates a declared field or domain constraint.
  PAYLOAD_TOO_LARGE:
    status: 413
    description: A declared or authoritative file size exceeds the Contract limit.
  UNSUPPORTED_MEDIA_TYPE:
    status: 415
    description: The authoritative file type is not allowed for this purpose.
  RATE_LIMITED:
    status: 429
    description: The caller must wait before retrying.
  SYSTEM_MAINTENANCE:
    status: 503
    description: The operation is fail-closed because the current system mode is not NORMAL.
  DEPENDENCY_UNAVAILABLE:
    status: 503
    description: A required database, object-storage, or approved dependency is unavailable.
  INTERNAL_ERROR:
    status: 500
    description: An unclassified server failure occurred without exposing internal details.
  EMAIL_ALREADY_IN_USE:
    status: 409
    description: The verified school email is already used by a current account.
  LOGIN_NAME_ALREADY_IN_USE:
    status: 409
    description: The sub-administrator login name is already used.
  STUDENT_NUMBER_ALREADY_IN_USE:
    status: 409
    description: The student number is already used in the organization.
  EMPLOYEE_ID_ALREADY_IN_USE:
    status: 409
    description: The teacher employee ID is already used in the organization.
  ACCOUNT_DELETION_BLOCKED:
    status: 409
    description: An in-progress student session or uncompleted sub-administrator responsibility blocks account deletion.
  ADMIN_RESPONSIBILITY_BLOCKED:
    status: 409
    description: Uncompleted sub-administrator responsibilities block disablement or deletion.
  INVITATION_INVALID:
    status: 422
    description: For preview, the presented invitation code is unknown, malformed, or cannot be safely projected. For join
      commands, it also covers a known invitation that is not currently joinable.
  COURSE_ALREADY_JOINED:
    status: 409
    description: The student already has an active course in the current semester.
  ENROLLMENT_NOT_ACTIVE:
    status: 409
    description: The enrollment is not active for this use case.
  COURSE_NOT_OPEN:
    status: 409
    description: The course is closed and rejects the requested mutation.
  COURSE_TARGET_TOTAL_INVALID:
    status: 422
    description: Course-related and other targets must total exactly 1200 minutes.
  COURSE_TARGET_BELOW_ACTIVE_CREDIT:
    status: 409
    description: A proposed target is lower than an active certification credit.
  COURSE_CLOSE_BLOCKED:
    status: 409
    description: An active session, unresolved roster item, application, endurance item, or grade item blocks closing.
  SEMESTER_COMBINATION_EXISTS:
