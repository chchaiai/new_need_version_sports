      - clientFlowNonce
      description: Explicit registration-start command, not preview. Client creates a cryptographically random 256-bit nonce
        once for this flow and reuses it for exact retries; server binds its digest as the anonymous command subject to the
        original invitation. No email verification or personal data is required to register before expiry; final joining still
        requires Identity Owner verification. No account/enrollment is created, and local draft/challenge request alone is
        not registration. Never log the nonce or persist it as plaintext server data.
    InvitationRegistrationFlow:
      type: object
