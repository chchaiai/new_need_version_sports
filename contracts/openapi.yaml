          minimum: 0
        activeStudentCount:
          type: integer
          format: int32
          minimum: 0
        distinctAdministrativeClassCount:
          type: integer
          format: int32
          minimum: 0
        studentsWithAdministrativeClassCount:
          type: integer
          format: int32
          minimum: 0
        teacherCount:
          type: integer
          format: int32
          minimum: 0
        enduranceRuleCount:
          type: integer
          format: int32
          minimum: 0
        enduranceRuleGroupCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 4
        health:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatus'
          minItems: 5
          maxItems: 5
        generatedAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
      required:
      - actor
      - currentSystemMode
      - currentSemester
      - studentCount
      - activeStudentCount
      - distinctAdministrativeClassCount
      - studentsWithAdministrativeClassCount
      - teacherCount
      - enduranceRuleCount
      - enduranceRuleGroupCount
      - health
      - generatedAt
      description: Permission-aware read-only overview. Counts are navigation/risk summaries and never bypass target-page
        authorization.
  responses:
