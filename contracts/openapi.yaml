      description: Self recipient only, filter both new and historical prohibited messages before list/count/cursor construction.
        Never serialize teacher notification DTO or FINAL_GRADE route. Target authorization rechecked on navigation.
      operationId: listOwnStudentNotifications
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      x-admin-permissions: []
      x-resource-scope: SELF
      x-system-mode: NORMAL_REQUIRED
      x-idempotency:
        required: false
        reason: Read-only operation.
      x-error-codes:
      - INVALID_CURSOR
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - SYSTEM_MAINTENANCE
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      - INVALID_REQUEST
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentNotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: read
        in: query
        required: false
        schema:
          type: boolean
        description: ' At most one occurrence of this decoded scalar query name; duplicates return HTTP 400 / INVALID_REQUEST.'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque keyset cursor returned by this exact operation and filter set. At most one occurrence of this
          decoded scalar query name; duplicates return HTTP 400 / INVALID_REQUEST.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum number of items to return. At most one occurrence of this decoded scalar query name; duplicates
          return HTTP 400 / INVALID_REQUEST. Decoded value must consist only of ASCII decimal digits, numeric value 1–100;
          leading zeros allowed, omission defaults to 20. No exponent, decimal point, sign or whitespace.
      x-query-serialization:
        scalarOccurrences: AT_MOST_ONE_AFTER_PARAMETER_NAME_DECODING
        invalidSyntaxError: INVALID_REQUEST
        invalidSyntaxStatus: 400
        limit:
          decodedPattern: ^[0-9]+$
          minimum: 1
          maximum: 100
          omittedDefault: 20
          leadingZeros: ALLOWED_NORMALIZED_TO_INTEGER
          rejectedForms:
          - exponent
          - decimal point
          - sign
          - whitespace
          - empty
          - non-ASCII digits
        scope: Declared scalar query parameters only. Values are decoded once; reject duplicate decoded names before selection/coercion.
          Existing enum/boolean/string constraints remain. Invalid opaque cursor content keeps INVALID_CURSOR; duplicate cursor
          is INVALID_REQUEST.
