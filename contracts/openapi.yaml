        occurredAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
      required:
      - reviewId
      - recordId
      - materialVersionId
      - sequenceNumber
      - roundNo
      - source
      - fromResult
      - result
      - reviewer
      - publicReason
      - publicComment
      - correctedReviewId
      - expiryCorrection
      - occurredAt
      description: Append-only decisions, teacher return actions and corrections. A return has null result, never a fabricated
        INVALID decision. No hidden note or AI provider payload is exposed.
      allOf:
      - if:
          properties:
            source:
              enum:
              - TEACHER_RETURN
          required:
          - source
        then:
          properties:
            result:
              type: 'null'
            publicReason:
              $ref: '#/components/schemas/PublicReviewReason'
            reviewer:
              $ref: '#/components/schemas/TeacherSummary'
      - if:
          properties:
            source:
              enum:
              - SYSTEM_AI
          required:
          - source
        then:
          properties:
            result:
              type: string
              const: VALID
            publicReason:
              type: 'null'
            reviewer:
              type: 'null'
      - if:
          properties:
            source:
              enum:
              - SYSTEM_EXPIRY
          required:
          - source
        then:
          properties:
            result:
              type: string
              const: INVALID
            reviewer:
              type: 'null'
            publicReason:
              allOf:
              - $ref: '#/components/schemas/PublicReviewReason'
              - properties:
                  code:
                    type: string
                    const: SUPPLEMENT_DEADLINE_MISSED
      - if:
          properties:
            source:
              enum:
              - PLATFORM_FAULT_CORRECTION
          required:
          - source
        then:
          properties:
            expiryCorrection:
              $ref: '#/components/schemas/ExpiryCorrectionFact'
            correctedReviewId:
              type: string
              description: Opaque public identifier; clients must not infer meaning from it.
              format: uuid
            reviewer:
              type: 'null'
      - if:
          properties:
            source:
              enum:
              - TEACHER
              - AUTHORIZED_CORRECTION
          required:
          - source
        then:
          properties:
            result:
              $ref: '#/components/schemas/ReviewResult'
            reviewer:
              $ref: '#/components/schemas/TeacherSummary'
      - if:
          properties:
            source:
              enum:
              - AUTHORIZED_CORRECTION
          required:
          - source
        then:
          properties:
            correctedReviewId:
              type: string
              description: Opaque public identifier; clients must not infer meaning from it.
              format: uuid
      - if:
          properties:
            source:
              enum:
              - SYSTEM_AI
              - TEACHER
              - TEACHER_RETURN
              - SYSTEM_EXPIRY
              - AUTHORIZED_CORRECTION
          required:
          - source
        then:
          properties:
            expiryCorrection:
              type: 'null'
      - if:
          properties:
            source:
              enum:
              - TEACHER_RETURN
          required:
          - source
        then:
          properties:
            publicReason:
              type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNCLEAR_EVIDENCE
                  - MISSING_REQUIRED_EVIDENCE
                  - EVIDENCE_SESSION_MISMATCH
                  - INCONSISTENT_EVIDENCE
                  - AUTHENTICITY_REQUIRES_CLARIFICATION
      - if:
          properties:
            result:
              enum:
              - INVALID
          required:
          - result
        then:
          properties:
            publicReason:
              type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNCLEAR_EVIDENCE
                  - MISSING_REQUIRED_EVIDENCE
                  - EVIDENCE_SESSION_MISMATCH
                  - INCONSISTENT_EVIDENCE
                  - CONFIRMED_REUSE_OR_MISUSE
                  - SUPPLEMENT_DEADLINE_MISSED
      - if:
          properties:
            result:
              enum:
              - VALID
          required:
          - result
        then:
          properties:
            publicReason:
              type: 'null'
      - if:
          properties:
            source:
              enum:
              - TEACHER
              - AUTHORIZED_CORRECTION
          required:
          - source
        then:
          properties:
            publicReason:
              anyOf:
              - type: 'null'
              - type: object
                properties:
                  code:
                    type: string
                    enum:
                    - UNCLEAR_EVIDENCE
                    - MISSING_REQUIRED_EVIDENCE
                    - EVIDENCE_SESSION_MISMATCH
                    - INCONSISTENT_EVIDENCE
                    - CONFIRMED_REUSE_OR_MISUSE
