      - currentSemester
      - openCourseCount
      - memberCount
      - unresolvedRosterFindingCount
      - pendingEnduranceCount
      - pendingApplicationCount
      - unpublishedFinalGradeCount
      - unreadNotificationCount
      - generatedAt
      description: When no CURRENT semester exists, currentSemester is null and every current-semester course/work count is
        zero. A null currentSemester is a business empty state, not a dependency failure.
    AdminDashboard:
      type: object
      additionalProperties: false
      properties:
        actor:
          $ref: '#/components/schemas/CurrentActor'
