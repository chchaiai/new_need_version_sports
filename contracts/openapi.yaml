        never reinterpreted by settlement. Valid unfinished first-material chains block even before an acceptance receipt
        exists.
    SettlementPreparationRequest:
      type: object
      additionalProperties: false
      properties:
        expectedCourseVersion:
          type: integer
          format: int64
          description: Optimistic-concurrency version.
          minimum: 0
        expectedPreviousSettlementVersionId:
          anyOf:
          - type: string
            description: Opaque public identifier; clients must not infer meaning from it.
            format: uuid
          - type: 'null'
        correctionFactId:
          anyOf:
          - type: string
            description: Opaque public identifier; clients must not infer meaning from it.
            format: uuid
          - type: 'null'
        reason:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - expectedCourseVersion
      - expectedPreviousSettlementVersionId
      - correctionFactId
      - reason
      description: Normal first settlement uses null correction and predecessor; correction references an authorized existing
        Owner fact and preceding report with reason. Server derives historical membership and all values; clients do not submit
        statistics, row arrays, blocker booleans or source tokens.
      allOf:
      - if:
          properties:
            correctionFactId:
              const: null
          required:
          - correctionFactId
        then:
          properties:
            expectedPreviousSettlementVersionId:
              type: 'null'
            reason:
              type: 'null'
      - if:
          properties:
            correctionFactId:
              type: string
          required:
          - correctionFactId
        then:
          properties:
            expectedPreviousSettlementVersionId:
              type: string
              description: Opaque public identifier; clients must not infer meaning from it.
              format: uuid
            reason:
              type: string
              minLength: 1
    SettlementPreparation:
      type: object
      additionalProperties: false
      properties:
        preparationId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        courseId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        semesterId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        expectedCourseVersion:
          type: integer
          format: int64
          description: Optimistic-concurrency version.
          minimum: 0
        previousSettlementVersionId:
          anyOf:
          - type: string
            description: Opaque public identifier; clients must not infer meaning from it.
            format: uuid
          - type: 'null'
        correctionFactId:
          anyOf:
          - type: string
            description: Opaque public identifier; clients must not infer meaning from it.
            format: uuid
          - type: 'null'
        reason:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        state:
          type: string
          enum:
          - READY
          - BLOCKED
          - UNAVAILABLE
        preparationToken:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        membershipScopeVersion:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SettlementSourceReference'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/SettlementBlocker'
        unavailableOwners:
          type: array
          items:
            type: string
            enum:
            - MEMBERSHIP
            - ROSTER
            - SESSIONS
            - MATERIALS
            - REVIEWS_AND_TIMERS
            - TECHNICAL_PROCESSING
            - EXEMPTIONS
            - CERTIFICATIONS
            - ENDURANCE
            - STATISTICS
            - OTHER_TEACHING
          uniqueItems: true
        preparedAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
      required:
      - preparationId
      - courseId
      - semesterId
      - expectedCourseVersion
      - previousSettlementVersionId
      - correctionFactId
      - reason
      - state
      - preparationToken
      - membershipScopeVersion
      - sources
      - blockers
      - unavailableOwners
      - preparedAt
      description: Full server manifest pins independently supplied complete member set, all sources, every immutable statistics
        checkpoint and content, and report predecessor. Public summary is not itself a trust proof. READY requires no new-start
        eligibility left (original closeout ended or course explicitly closed), no pending chains, all sources complete/current
        and exact member coverage. Being below1200 is not a blocker. Ready tokens are invalidated by any relevant drift.
      allOf:
      - if:
          properties:
            state:
              const: READY
          required:
          - state
        then:
          properties:
            preparationToken:
              type: string
              minLength: 1
            membershipScopeVersion:
              type: string
              minLength: 1
            sources:
              minItems: 11
              maxItems: 11
              allOf:
              - contains:
                  properties:
                    owner:
                      const: MEMBERSHIP
                  required:
                  - owner
                minContains: 1
                maxContains: 1
