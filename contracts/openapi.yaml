        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/account-deletion:
    post:
      tags:
      - Identity
      summary: Delete the current student or sub-administrator account
      description: Requires second-factor verification. Login account, credentials, sessions, challenges, verified email/login
        name, and current profile PII are deleted; exercise records, formal media, and audit events remain linked only to
        an opaque non-login historical subject.
      operationId: deleteOwnAccount
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: SELF_STUDENT_OR_SUB_ADMIN
      x-system-mode: NORMAL_REQUIRED
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - CHALLENGE_EXPIRED
      - ACCOUNT_DELETION_BLOCKED
      - VERSION_CONFLICT
      - INVALID_REQUEST
      - FIRST_PASSWORD_CHANGE_REQUIRED
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - SYSTEM_MAINTENANCE
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
  /app-release-policy:
    get:
