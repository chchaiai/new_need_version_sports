components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Short-lived access token in `Authorization: Bearer <token>`. Refresh credentials are accepted only in
        the refresh request body and must never appear in URLs.'
  headers:
    RequestId:
      description: Server correlation identifier; the same value appears in ErrorEnvelope.requestId.
      schema:
        type: string
        minLength: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID scoped to the authenticated actor or anonymous command subject, operationId, and canonical resource
        identity. A normalized-command replay returns the original committed response; different normalized content returns
        IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
      - INVALID_REQUEST
      - INVALID_CURSOR
      - AUTHENTICATION_REQUIRED
      - INVALID_CREDENTIALS
      - TOKEN_EXPIRED
      - CHALLENGE_EXPIRED
      - ACCOUNT_DISABLED
      - FIRST_PASSWORD_CHANGE_REQUIRED
      - FORBIDDEN
      - RESOURCE_NOT_FOUND
      - IDEMPOTENCY_KEY_REUSED
      - VERSION_CONFLICT
      - VALIDATION_FAILED
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - RATE_LIMITED
      - SYSTEM_MAINTENANCE
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      - EMAIL_ALREADY_IN_USE
      - LOGIN_NAME_ALREADY_IN_USE
      - STUDENT_NUMBER_ALREADY_IN_USE
      - EMPLOYEE_ID_ALREADY_IN_USE
      - ACCOUNT_DELETION_BLOCKED
      - ADMIN_RESPONSIBILITY_BLOCKED
      - INVITATION_INVALID
      - COURSE_ALREADY_JOINED
      - ENROLLMENT_NOT_ACTIVE
      - COURSE_NOT_OPEN
      - COURSE_TARGET_TOTAL_INVALID
      - COURSE_TARGET_BELOW_ACTIVE_CREDIT
      - COURSE_CLOSE_BLOCKED
      - SEMESTER_COMBINATION_EXISTS
      - SEMESTER_NOT_UPCOMING
      - SEMESTER_NOT_CURRENT
      - SEMESTER_START_DATE_NOT_REACHED
      - ROSTER_SOURCE_INVALID
      - ROSTER_ROW_LIMIT_EXCEEDED
      - ROSTER_FINDING_ALREADY_RESOLVED
      - ROSTER_SNAPSHOT_NOT_IN_COURSE
      - SESSION_ALREADY_ACTIVE
      - SESSION_TRANSITION_INVALID
      - CHECKIN_WINDOW_CLOSED
      - COURSE_TARGET_ALREADY_MET
      - DAILY_RECORD_ALREADY_EXISTS
      - MEDIA_NOT_VERIFIED
      - MEDIA_OWNERSHIP_MISMATCH
      - MEDIA_LIMIT_EXCEEDED
      - MEDIA_CONTENT_INVALID
      - MEDIA_ALREADY_BOUND
      - RECORD_DESCRIPTION_INVALID
      - REVIEW_RESULT_UNCHANGED
      - ENDURANCE_OUTCOME_EXEMPT
      - ENDURANCE_RULE_TABLE_INVALID
      - APPLICATION_EVIDENCE_LIMIT_EXCEEDED
      - APPLICATION_TRANSITION_INVALID
      - APPLICATION_SUPPLEMENT_NOT_ALLOWED
      - CERTIFICATION_CREDIT_INVALID
      - FINAL_GRADE_VALUE_INVALID
      - FEEDBACK_TRANSITION_INVALID
      - HELP_ARTICLE_TRANSITION_INVALID
      - HELP_ARTICLE_PUBLICATION_INCOMPLETE
      - SYSTEM_MODE_UNCHANGED
      - MAINTENANCE_ANNOUNCEMENT_REQUIRED
      - AUDIT_DATE_RANGE_INVALID
      - AUDIT_ARCHIVE_NOT_READY
    DirectUploadHttpMethod:
      type: string
      description: HTTP method covered by every short-lived direct-upload authorization in this Contract version.
      enum:
      - PUT
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - field
      - reason
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldViolations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        currentVersion:
          anyOf:
          - type: integer
            format: int64
            description: Optimistic-concurrency version.
            minimum: 0
          - type: 'null'
        retryAfterSeconds:
          anyOf:
          - type: integer
            format: int32
            minimum: 0
          - type: 'null'
        blockers:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - fieldViolations
      - currentVersion
      - retryAfterSeconds
      - blockers
      description: Safe structured details. Arrays are empty when no values apply; the entire details property may instead
        be null.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Localized human-readable message; clients branch only on code.
          minLength: 1
        requestId:
          type: string
          description: Correlation identifier safe to provide to support.
          minLength: 1
        details:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetails'
          - type: 'null'
      required:
      - code
      - message
      - requestId
      - details
      example:
        code: COURSE_ALREADY_JOINED
        message: 你已经加入该课程
        requestId: req_xxx
        details: null
    CursorPage:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        previousCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - limit
      - nextCursor
      - previousCursor
      description: Keyset pagination metadata. A null cursor means that direction has no more results.
    CommandAccepted:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
      required:
      - accepted
    DeletionResult:
      type: object
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          const: true
        retainedFacts:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - deleted
      - retainedFacts
    LocalizedText:
      type: object
      additionalProperties: false
      properties:
        zh:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
      required:
      - zh
      - en
    PersonSummary:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        displayName:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - STUDENT
          - TEACHER
          - ADMIN
      required:
      - userId
      - displayName
      - role
    ActorRole:
      type: string
      enum:
      - STUDENT
      - TEACHER
      - ADMIN
    AdminKind:
      type: string
      enum:
      - SUPER
      - SUB
    AdminPermission:
      type: string
      enum:
      - COURSE_VIEW
      - SEMESTER
      - USERS_ACCOUNTS
      - FEEDBACK
      - GLOBAL_RULES
      - SYSTEM_MODE
      - HELP_CENTER
      - AUDIT_QUERY
    AuthChallengePurpose:
      type: string
      enum:
      - STUDENT_LOGIN
      - STUDENT_EMAIL_BINDING
      - PASSWORD_RESET
      - CURRENT_EMAIL_VERIFICATION
      - NEW_EMAIL_VERIFICATION
      - ACCOUNT_DELETION
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/AuthChallengePurpose'
        email:
          type: string
          description: Normalized school email address.
          minLength: 3
          format: email
      required:
      - purpose
      - email
      description: Requests an email OTP challenge. The response must not disclose whether an account exists.
    AuthChallenge:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        expiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 0
      required:
      - challengeId
      - expiresAt
      - retryAfterSeconds
    OtpProof:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        code:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - challengeId
      - code
    StudentSessionRequest:
      type: object
      additionalProperties: false
      properties:
        otpProof:
          $ref: '#/components/schemas/OtpProof'
      required:
      - otpProof
    PasswordSessionRequest:
      type: object
      additionalProperties: false
      properties:
        loginType:
          type: string
          enum:
          - TEACHER_EMAIL
          - ADMIN_EMAIL
          - ADMIN_LOGIN_NAME
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - loginType
      - identifier
      - password
    CurrentActor:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        organizationId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        role:
          $ref: '#/components/schemas/ActorRole'
        displayName:
          type: string
          minLength: 1
        verifiedEmail:
          type: string
          description: Normalized school email address.
          minLength: 3
          format: email
        accountState:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        adminKind:
          anyOf:
          - $ref: '#/components/schemas/AdminKind'
          - type: 'null'
        adminPermissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermission'
        mustChangePassword:
          type: boolean
          description: True only while a Teacher/Admin is using a system- or other-person-assigned temporary initial password.
            Successful self password change or verified-email self reset clears it to false.
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version.
          minimum: 0
      required:
      - userId
      - organizationId
      - role
      - displayName
      - verifiedEmail
      - accountState
      - adminKind
      - adminPermissions
      - mustChangePassword
      - version
    SessionTokenPair:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          format: password
        accessExpiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        refreshToken:
          type: string
          minLength: 1
          format: password
        refreshExpiresAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        actor:
          $ref: '#/components/schemas/CurrentActor'
      required:
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
