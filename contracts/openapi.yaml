      - countedRecordMinutes
      - countedCertificationMinutes
      - invalidActualMinutes
      - validUncountedEligibleMinutes
      - validFormulaExcludedMinutes
      - pendingRecordCount
      description: Exactly one row per category. Only raw total==1200 means targetMet; display 100 can mean1199. Actual seconds
        include all real records, invalidActualMinutes=sum invalid floor(s/60), validUncounted=sum valid(q-a), validFormulaExcluded=sum
