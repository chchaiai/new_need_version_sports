          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        student:
          $ref: '#/components/schemas/StudentReference'
        state:
          type: string
          enum:
          - CURRENT
          - RECOMPUTING
          - UNAVAILABLE
