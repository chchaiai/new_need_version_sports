  /student/notifications/{notificationId}/read:
    post:
      tags:
      - Notifications
      summary: Mark a safe student notification read
      description: Recheck current recipient and safe template/source at read and replay. Retain first server readAt. If an
        old message or old receipt contains prohibited content, deny delivery rather than replay an unsafe payload. No source
        business mutation.
      operationId: markOwnStudentNotificationRead
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      x-admin-permissions: []
      x-resource-scope: SELF
      x-system-mode: NORMAL_REQUIRED
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
        evaluationOrder:
        - AUTHENTICATION_AND_ORIGINAL_RESOURCE_SCOPE
        - EXACT_COMMITTED_RECEIPT
        - NEW_COMMAND_MODE_VERSION_ELIGIBILITY_AND_SOURCE_PROTECTION
      x-error-codes:
      - RESOURCE_NOT_FOUND
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - SYSTEM_MAINTENANCE
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Opaque notificationId.
        schema:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      x-system-mode-replay: AUTHORIZED_COMMITTED_RESULT_ONLY
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Short-lived access token in `Authorization: Bearer <token>`. Refresh credentials are accepted only in
        the refresh request body and must never appear in URLs.'
  headers:
    RequestId:
      description: Server correlation identifier; the same value appears in ErrorEnvelope.requestId.
      schema:
        type: string
        minLength: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID scoped to the authenticated actor or anonymous command subject, operationId, and canonical resource
        identity. A normalized-command replay returns the original committed response; different normalized content returns
        IDEMPOTENCY_KEY_REUSED. Historical student identity display follows the scoped deletion-aware exception in x-historical-students.
      schema:
        type: string
        format: uuid
  schemas:
