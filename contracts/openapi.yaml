      - eligibleMinutes
      - countedMinutes
      - reviewResult
      - explanations
      description: m=floor(sum ACTIVE seconds/60) once; q=0 if m<H else min(m,60); a only from joint selected VALID set, 0<=a<=q.
        Original Shanghai start date/week and immutable rule never move at completion/supplement. Non-valid records have a=0.
        Missing sources are unavailable, not zero. Explanation cannot hide inconsistent output.
