          format: date-time
        graceEndsAt:
          type: string
          description: RFC 3339 UTC instant. Servers emit an explicit Z offset; clients localize only for display.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
          format: date-time
        status:
          type: string
          enum:
          - REGISTERED
          - COMPLETED
          - TERMINATED
        course:
          $ref: '#/components/schemas/InvitationCourseSummary'
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version.
          minimum: 0
      required:
      - flowId
      - registeredAt
      - originalExpiresAt
      - graceEndsAt
      - status
      - course
      - version
      description: Same authenticated actor or server-bound anonymous flow subject, same original invitation/course/semester,
        server registeredAt<originalExpiresAt. Fixed grace end expiresAt+600 seconds. First acceptance strictly before end.
        Revoke/admission close/course close/semester invalidity terminate unfinished flows. No refresh extension or identity/unique-course
        exemption.
