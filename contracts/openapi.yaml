              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
  /me:
    get:
      tags:
      - Identity
      summary: Get the current authenticated actor
      description: Returns only the current account/profile projection required by clients; no credentials or internal subject
        history are exposed.
      operationId: getCurrentActor
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      - TEACHER
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: SELF
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: false
        reason: Read-only operation.
      x-error-codes:
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/password:
    put:
      tags:
      - Identity
      summary: Change the current teacher or administrator password
      description: Allows only the ACTIVE Teacher/Admin account holder to replace their own password using the current password
        and expected version. Success preserves the current session, revokes every other session, and returns CurrentActor
        with mustChangePassword=false.
      operationId: changeOwnPassword
      security:
      - bearerAuth: []
      x-roles:
      - TEACHER
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: SELF
      x-system-mode: ALLOWED_DURING_MAINTENANCE
      x-idempotency:
        required: true
        header: Idempotency-Key
        replay: Same authenticated actor or anonymous command subject, operationId, canonical resource identity, key, and
          normalized command returns the original committed result.
        reuseConflict: Same scoped key with a different normalized command returns IDEMPOTENCY_KEY_REUSED.
      x-error-codes:
      - INVALID_CREDENTIALS
      - ACCOUNT_DISABLED
      - VERSION_CONFLICT
      - INVALID_REQUEST
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - IDEMPOTENCY_KEY_REUSED
