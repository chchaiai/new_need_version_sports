      additionalProperties: false
      properties:
        userId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        organizationId:
          type: string
          description: Opaque public identifier; clients must not infer meaning from it.
          format: uuid
        role:
          $ref: '#/components/schemas/ActorRole'
        displayName:
          type: string
          minLength: 1
        verifiedEmail:
          type: string
          description: Normalized school email address.
          minLength: 3
          format: email
        accountState:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        adminKind:
          anyOf:
          - $ref: '#/components/schemas/AdminKind'
          - type: 'null'
        adminPermissions:
          type: array
