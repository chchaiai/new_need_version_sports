        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiedEmailChangeRequest'
  /me/account-deletion-impact:
    get:
      tags:
      - Identity
      summary: Inspect own-account deletion impact and blockers
      description: Returns explicit current blockers plus the account data deleted and formal facts retained on success. Teachers
        and super administrators are not eligible for self-deletion.
      operationId: getOwnAccountDeletionImpact
      security:
      - bearerAuth: []
      x-roles:
      - STUDENT
      - ADMIN
      x-admin-permissions: []
      x-resource-scope: SELF_STUDENT_OR_SUB_ADMIN
      x-system-mode: NORMAL_REQUIRED
      x-idempotency:
        required: false
        reason: Read-only operation.
      x-error-codes:
      - FORBIDDEN
      - FIRST_PASSWORD_CHANGE_REQUIRED
      - AUTHENTICATION_REQUIRED
      - SYSTEM_MAINTENANCE
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionImpact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
